<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="700" fill="#ffffff"/>

  <!-- cycle arcs -->
  <path d="M 706 133 A 250 250 0 0 1 849 382" fill="none" stroke="#64748b" stroke-width="3.5" marker-end="url(#arr)"/>
  <path d="M 743 565 A 250 250 0 0 1 457 565" fill="none" stroke="#64748b" stroke-width="3.5" marker-end="url(#arr)"/>
  <path d="M 351 382 A 250 250 0 0 1 494 133" fill="none" stroke="#64748b" stroke-width="3.5" marker-end="url(#arr)"/>

  <!-- govern spokes (cross-cutting) -->
  <line x1="600" y1="255" x2="600" y2="200" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="6 5"/>
  <line x1="690" y1="412" x2="738" y2="440" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="6 5"/>
  <line x1="513" y1="412" x2="462" y2="440" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="6 5"/>

  <!-- GOVERN center -->
  <circle cx="600" cy="360" r="100" fill="#f5f3ff" stroke="#7c3aed" stroke-width="4"/>
  <text x="600" y="348" text-anchor="middle" font-size="28" font-weight="bold" fill="#5b21b6">GOVERN</text>
  <text x="600" y="374" text-anchor="middle" font-size="14.5" fill="#4c1d95">Culture of risk management,</text>
  <text x="600" y="393" text-anchor="middle" font-size="14.5" fill="#4c1d95">accountability &amp; oversight</text>

  <!-- MAP -->
  <circle cx="600" cy="110" r="85" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/>
  <text x="600" y="100" text-anchor="middle" font-size="25" font-weight="bold" fill="#1d4ed8">MAP</text>
  <text x="600" y="124" text-anchor="middle" font-size="13.5" fill="#1e3a8a">Context is recognised,</text>
  <text x="600" y="141" text-anchor="middle" font-size="13.5" fill="#1e3a8a">risks are identified</text>

  <!-- MEASURE -->
  <circle cx="816" cy="485" r="85" fill="#fffbeb" stroke="#d97706" stroke-width="4"/>
  <text x="816" y="473" text-anchor="middle" font-size="25" font-weight="bold" fill="#b45309">MEASURE</text>
  <text x="816" y="497" text-anchor="middle" font-size="13" fill="#92400e">Risks analysed; metrics</text>
  <text x="816" y="514" text-anchor="middle" font-size="13" fill="#92400e">&amp; thresholds defined</text>

  <!-- MANAGE -->
  <circle cx="384" cy="485" r="85" fill="#ecfdf5" stroke="#059669" stroke-width="4"/>
  <text x="384" y="473" text-anchor="middle" font-size="25" font-weight="bold" fill="#047857">MANAGE</text>
  <text x="384" y="497" text-anchor="middle" font-size="13.5" fill="#065f46">Risks prioritised, treated,</text>
  <text x="384" y="514" text-anchor="middle" font-size="13.5" fill="#065f46">monitored &amp; improved</text>

  <!-- caption chip -->
  <rect x="330" y="625" width="540" height="44" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="600" y="653" text-anchor="middle" font-size="16" fill="#334155">GOVERN is cross-cutting — it informs Map, Measure and Manage</text>

  <!-- side labels -->
  <text x="1035" y="120" text-anchor="middle" font-size="14" fill="#94a3b8">NIST AI 100-1</text>
  <text x="1035" y="140" text-anchor="middle" font-size="14" fill="#94a3b8">AI RMF 1.0 (2023)</text>
  <text x="165" y="120" text-anchor="middle" font-size="14" fill="#94a3b8">NIST AI 600-1</text>
  <text x="165" y="140" text-anchor="middle" font-size="14" fill="#94a3b8">GenAI Profile (2024)</text>
</svg>
