  <text x="365" y="248" text-anchor="middle" font-size="10.5" fill="#64748b">AI security gateway</text>
  <text x="365" y="262" text-anchor="middle" font-size="10.5" fill="#64748b">mask-and-restore PII</text>
  <rect x="485" y="204" width="210" height="80" rx="7" fill="#ffffff" stroke="#EF4444" stroke-width="1.5"/>
