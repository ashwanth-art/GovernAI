  <text x="140" y="98" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e293b">WandB RAI Toolkit</text>
  <text x="140" y="114" text-anchor="middle" font-size="10.5" fill="#64748b">red-teaming, policy checks</text>
  <text x="140" y="128" text-anchor="middle" font-size="10.5" fill="#64748b">evidence reports</text>
  <rect x="260" y="70" width="210" height="80" rx="7" fill="#ffffff" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="365" y="98" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e293b">IBM AI Fairness 360</text>
  <text x="365" y="114" text-anchor="middle" font-size="10.5" fill="#64748b">70+ bias metrics</text>
  <text x="365" y="128" text-anchor="middle" font-size="10.5" fill="#64748b">10+ mitigation algorithms</text>
  <rect x="485" y="70" width="210" height="80" rx="7" fill="#ffffff" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="590" y="98" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e293b">Microsoft Fairlearn</text>
  <text x="590" y="114" text-anchor="middle" font-size="10.5" fill="#64748b">fairness dashboard</text>
  <text x="590" y="128" text-anchor="middle" font-size="10.5" fill="#64748b">mitigation algorithms</text>
  <rect x="710" y="70" width="210" height="80" rx="7" fill="#ffffff" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="815" y="98" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e293b">IBM AIX360</text>
  <text x="815" y="114" text-anchor="middle" font-size="10.5" fill="#64748b">explainability: LIME,</text>
  <text x="815" y="128" text-anchor="middle" font-size="10.5" fill="#64748b">SHAP, contrastive</text>

  <!-- Layer 3: Runtime Guardrails -->
  <rect x="20" y="182" width="920" height="122" rx="10" fill="#FEF2F2" stroke="#B91C1C" stroke-width="2"/>
  <rect x="30" y="174" width="220" height="20" rx="5" fill="#FEE2E2"/>
  <text x="140" y="188" text-anchor="middle" font-size="11" font-weight="bold" fill="#B91C1C">Layer 3 &#x2014; Runtime Guardrails</text>
