<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="620" fill="#ffffff"/>
  <text x="480" y="20" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e293b">Open-Source AI Governance &#x2014; Layered Architecture</text>
  <text x="480" y="38" text-anchor="middle" font-size="12" fill="#64748b">No single tool covers everything. A layered stack maps each concern to the right enforcement point.</text>

  <!-- Layer 4: Continuous Evaluation -->
  <rect x="20" y="48" width="920" height="122" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <rect x="30" y="40" width="230" height="20" rx="5" fill="#FEF3C7"/>
