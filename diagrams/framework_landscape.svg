  <rect x="625" y="338" width="280" height="80" rx="7" fill="#ffffff" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="765" y="366" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e293b">WandB RAI (eval gates)</text>
  <text x="765" y="382" text-anchor="middle" font-size="10.5" fill="#64748b">evidence-backed release</text>
  <text x="765" y="396" text-anchor="middle" font-size="10.5" fill="#64748b">approval records</text>

  <!-- Layer 1: Organisational Governance -->
  <rect x="20" y="450" width="920" height="122" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <rect x="30" y="442" width="250" height="20" rx="5" fill="#DBEAFE"/>
  <text x="155" y="456" text-anchor="middle" font-size="11" font-weight="bold" fill="#2563EB">Layer 1 &#x2014; Organisational Governance</text>
  <rect x="35" y="472" width="210" height="80" rx="7" fill="#ffffff" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="140" y="498" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">ai-governance-</text>
  <text x="140" y="512" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">framework</text>
  <text x="140" y="530" text-anchor="middle" font-size="10.5" fill="#64748b">risk scoring, model cards</text>
  <rect x="260" y="472" width="210" height="80" rx="7" fill="#ffffff" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="365" y="502" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e293b">Assuro</text>
  <text x="365" y="518" text-anchor="middle" font-size="10.5" fill="#64748b">full platform, Docker</text>
  <text x="365" y="532" text-anchor="middle" font-size="10.5" fill="#64748b">EU AI Act + NIST + ISO</text>
  <rect x="485" y="472" width="210" height="80" rx="7" fill="#ffffff" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="590" y="502" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e293b">checkpoint-ai</text>
  <text x="590" y="518" text-anchor="middle" font-size="10.5" fill="#64748b">self-assessment</text>
  <text x="590" y="532" text-anchor="middle" font-size="10.5" fill="#64748b">OSCAL SSP, PyPI</text>
  <rect x="710" y="472" width="210" height="80" rx="7" fill="#ffffff" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="815" y="502" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e293b">ai-rmf-starter</text>
  <text x="815" y="518" text-anchor="middle" font-size="10.5" fill="#64748b">templates, docs-first</text>
