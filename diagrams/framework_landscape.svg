  <text x="175" y="396" text-anchor="middle" font-size="10.5" fill="#64748b">12 deploy-time rules</text>
  <rect x="330" y="338" width="280" height="80" rx="7" fill="#ffffff" stroke="#8B5CF6" stroke-width="1.5"/>
