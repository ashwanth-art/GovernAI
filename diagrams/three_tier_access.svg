<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" font-family="Helvetica, Arial, sans-serif">
  <rect width="1100" height="520" fill="#ffffff"/>
  <text x="550" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">Three-Tier Access Model  More Access = Deeper Assessment</text>
  <text x="550" y="44" text-anchor="middle" font-size="11" fill="#64748b">Client chooses their comfort level; agent adapts scope accordingly</text>

  <!-- Tier 1 -->
  <rect x="30" y="70" width="330" height="420" rx="14" fill="#ffffff" stroke="#2563EB" stroke-width="2"/>
  <path d="M 30 84 a14,14 0 0 1 14,-14 h 302 a14,14 0 0 1 14,14 v 56 h -330 z" fill="#2563EB"/>
  <text x="195" y="97" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">TIER 1</text>
  <text x="195" y="118" text-anchor="middle" font-size="13" fill="#dbeafe">Black-Box (API Only)</text>

  <text x="195" y="160" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">What you provide:</text>
  <circle cx="55" cy="185" r="4" fill="#2563EB"/><text x="70" y="190" font-size="12" fill="#334155">RAG endpoint URL</text>
  <circle cx="55" cy="210" r="4" fill="#2563EB"/><text x="70" y="215" font-size="12" fill="#334155">API key / auth token</text>
  <circle cx="55" cy="235" r="4" fill="#2563EB"/><text x="70" y="240" font-size="12" fill="#334155">Organization ID</text>
  <circle cx="55" cy="260" r="4" fill="#2563EB"/><text x="70" y="265" font-size="12" fill="#334155">Risk tier declaration</text>

  <text x="195" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">What you get:</text>
  <circle cx="55" cy="325" r="4" fill="#64748b"/><text x="70" y="330" font-size="12" fill="#334155">Prompt injection testing</text>
  <circle cx="55" cy="350" r="4" fill="#64748b"/><text x="70" y="355" font-size="12" fill="#334155">Data leakage probes</text>
  <circle cx="55" cy="375" r="4" fill="#64748b"/><text x="70" y="380" font-size="12" fill="#334155">Hallucination metrics</text>
  <circle cx="55" cy="400" r="4" fill="#64748b"/><text x="70" y="405" font-size="12" fill="#334155">Output validation</text>
  <circle cx="55" cy="425" r="4" fill="#64748b"/><text x="70" y="430" font-size="12" fill="#334155">Model fingerprinting</text>

  <rect x="55" y="445" width="280" height="30" rx="15" fill="#EFF6FF" stroke="#2563EB"/>
  <text x="195" y="465" text-anchor="middle" font-size="12" font-weight="bold" fill="#2563EB">Coverage: ~40% of controls</text>

  <!-- Tier 2 -->
  <rect x="385" y="70" width="330" height="420" rx="14" fill="#ffffff" stroke="#059669" stroke-width="2.5"/>
  <path d="M 385 84 a14,14 0 0 1 14,-14 h 302 a14,14 0 0 1 14,14 v 56 h -330 z" fill="#059669"/>
  <text x="550" y="97" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">TIER 2</text>
  <text x="550" y="118" text-anchor="middle" font-size="13" fill="#d1fae5">Gray-Box (Recommended)</text>

  <text x="550" y="160" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">What you provide (+ Tier 1):</text>
  <circle cx="410" cy="185" r="4" fill="#059669"/><text x="425" y="190" font-size="12" fill="#334155">Source code repo access</text>
  <circle cx="410" cy="210" r="4" fill="#059669"/><text x="425" y="215" font-size="12" fill="#334155">K8s kubeconfig (read-only)</text>
  <circle cx="410" cy="235" r="4" fill="#059669"/><text x="425" y="240" font-size="12" fill="#334155">Cloud creds (read-only IAM)</text>
  <circle cx="410" cy="260" r="4" fill="#059669"/><text x="425" y="265" font-size="12" fill="#334155">Observability API key</text>
  <circle cx="410" cy="285" r="4" fill="#059669"/><text x="425" y="290" font-size="12" fill="#334155">CI/CD pipeline access</text>

  <text x="550" y="320" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">What you get (+ Tier 1):</text>
  <circle cx="410" cy="345" r="4" fill="#64748b"/><text x="425" y="350" font-size="12" fill="#334155">Full architecture map (AI-BOM)</text>
  <circle cx="410" cy="370" r="4" fill="#64748b"/><text x="425" y="375" font-size="12" fill="#334155">Audit log verification</text>
  <circle cx="410" cy="395" r="4" fill="#64748b"/><text x="425" y="400" font-size="12" fill="#334155">Infra security posture</text>
  <circle cx="410" cy="420" r="4" fill="#64748b"/><text x="425" y="425" font-size="12" fill="#334155">Vector DB poison scan</text>

  <rect x="410" y="445" width="280" height="30" rx="15" fill="#ECFDF5" stroke="#059669"/>
  <text x="550" y="465" text-anchor="middle" font-size="12" font-weight="bold" fill="#059669">Coverage: ~80% of controls</text>

  <!-- Tier 3 -->
  <rect x="740" y="70" width="330" height="420" rx="14" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <path d="M 740 84 a14,14 0 0 1 14,-14 h 302 a14,14 0 0 1 14,14 v 56 h -330 z" fill="#7c3aed"/>
  <text x="905" y="97" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">TIER 3</text>
  <text x="905" y="118" text-anchor="middle" font-size="13" fill="#ede9fe">White-Box (Maximum)</text>

  <text x="905" y="160" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">What you provide (+ Tier 2):</text>
  <circle cx="765" cy="185" r="4" fill="#7c3aed"/><text x="780" y="190" font-size="12" fill="#334155">Staging env + write access</text>
  <circle cx="765" cy="210" r="4" fill="#7c3aed"/><text x="780" y="215" font-size="12" fill="#334155">Second tenant credentials</text>
  <circle cx="765" cy="235" r="4" fill="#7c3aed"/><text x="780" y="240" font-size="12" fill="#334155">Model weights (if self-hosted)</text>
  <circle cx="765" cy="260" r="4" fill="#7c3aed"/><text x="780" y="265" font-size="12" fill="#334155">Data pipeline access</text>

  <text x="905" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">What you get (+ Tier 2):</text>
  <circle cx="765" cy="325" r="4" fill="#64748b"/><text x="780" y="330" font-size="12" fill="#334155">Full poisoning resilience test</text>
  <circle cx="765" cy="350" r="4" fill="#64748b"/><text x="780" y="355" font-size="12" fill="#334155">Cross-tenant isolation proof</text>
  <circle cx="765" cy="375" r="4" fill="#64748b"/><text x="780" y="380" font-size="12" fill="#334155">White-box bias auditing</text>
  <circle cx="765" cy="400" r="4" fill="#64748b"/><text x="780" y="405" font-size="12" fill="#334155">Complete data lineage trace</text>
  <circle cx="765" cy="425" r="4" fill="#64748b"/><text x="780" y="430" font-size="12" fill="#334155">Activation-level analysis</text>

  <rect x="765" y="445" width="280" height="30" rx="15" fill="#F5F3FF" stroke="#7c3aed"/>
  <text x="905" y="465" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c3aed">Coverage: ~95% of controls</text>
</svg>
