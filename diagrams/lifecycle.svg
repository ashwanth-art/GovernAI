<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1400" height="760" fill="#ffffff"/>

  <!-- LIFECYCLE container -->
  <rect x="30" y="35" width="1340" height="165" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="46" y="23" width="700" height="26" rx="6" fill="#e2e8f0"/>
  <text x="396" y="41" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#475569">AI system lifecycle — MAP the context · MEASURE against thresholds · MANAGE and improve</text>

  <rect x="60" y="80" width="240" height="90" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="180" y="115" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#1e293b">Data sourcing</text>
  <text x="180" y="136" text-anchor="middle" font-size="12.5" fill="#64748b">consent, lawful basis,</text>
  <text x="180" y="152" text-anchor="middle" font-size="12.5" fill="#64748b">provenance</text>

  <rect x="322" y="80" width="240" height="90" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="442" y="115" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#1e293b">Data preparation</text>
  <text x="442" y="136" text-anchor="middle" font-size="12.5" fill="#64748b">minimisation, quality,</text>
  <text x="442" y="152" text-anchor="middle" font-size="12.5" fill="#64748b">de-identification</text>

  <rect x="584" y="80" width="240" height="90" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="704" y="115" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#1e293b">Model build / selection</text>
  <text x="704" y="136" text-anchor="middle" font-size="12.5" fill="#64748b">foundation model choice,</text>
  <text x="704" y="152" text-anchor="middle" font-size="12.5" fill="#64748b">fine-tuning, vendor checks</text>

  <rect x="846" y="80" width="240" height="90" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="966" y="115" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#1e293b">Deployment &amp; use</text>
  <text x="966" y="136" text-anchor="middle" font-size="12.5" fill="#64748b">prompts, outputs,</text>
  <text x="966" y="152" text-anchor="middle" font-size="12.5" fill="#64748b">human oversight</text>

  <rect x="1108" y="80" width="240" height="90" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="1228" y="115" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#1e293b">Monitor &amp; retire</text>
  <text x="1228" y="136" text-anchor="middle" font-size="12.5" fill="#64748b">drift, incidents, audits,</text>
  <text x="1228" y="152" text-anchor="middle" font-size="12.5" fill="#64748b">decommissioning</text>

  <line x1="300" y1="125" x2="315" y2="125" stroke="#64748b" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="562" y1="125" x2="577" y2="125" stroke="#64748b" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="824" y1="125" x2="839" y2="125" stroke="#64748b" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="1086" y1="125" x2="1101" y2="125" stroke="#64748b" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- DATA GOVERNANCE container -->
  <rect x="30" y="255" width="650" height="200" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
  <rect x="46" y="243" width="250" height="26" rx="6" fill="#d1fae5"/>
