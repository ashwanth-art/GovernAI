<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="480" fill="#ffffff"/>
  <text x="450" y="20" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e293b">Gateway Architecture &#x2014; Guardrails in the Data Path</text>
  <text x="450" y="38" text-anchor="middle" font-size="12" fill="#64748b">Every LLM call passes through a single enforcement point</text>

  <text x="90" y="58" text-anchor="middle" font-size="11" font-weight="bold" fill="#2563EB">YOUR APPS</text>
  <text x="760" y="58" text-anchor="middle" font-size="11" font-weight="bold" fill="#047857">MODEL PROVIDERS</text>

  <!-- App boxes left -->
  <rect x="15" y="72" width="150" height="44" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="90" y="99" text-anchor="middle" font-size="12" fill="#1e293b">App A (chatbot)</text>
  <rect x="15" y="126" width="150" height="44" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="90" y="153" text-anchor="middle" font-size="12" fill="#1e293b">App B (agent)</text>
  <rect x="15" y="180" width="150" height="44" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="90" y="207" text-anchor="middle" font-size="12" fill="#1e293b">App C (RAG)</text>
  <rect x="15" y="234" width="150" height="44" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="90" y="261" text-anchor="middle" font-size="12" fill="#1e293b">App D (internal)</text>

  <!-- arrows to gateway -->
  <line x1="165" y1="94" x2="245" y2="155" stroke="#64748b" stroke-width="1.5"/>
  <line x1="165" y1="148" x2="245" y2="175" stroke="#64748b" stroke-width="1.5"/>
  <line x1="165" y1="202" x2="245" y2="210" stroke="#64748b" stroke-width="1.5"/>
  <line x1="165" y1="256" x2="245" y2="240" stroke="#64748b" stroke-width="1.5"/>

  <!-- GATEWAY box center -->
  <rect x="245" y="65" width="350" height="330" rx="12" fill="#0f172a"/>
  <text x="420" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">AI GOVERNANCE GATEWAY</text>
  <text x="420" y="104" text-anchor="middle" font-size="10" fill="#94a3b8">OpenAI-compatible /v1/chat/completions</text>

  <rect x="262" y="115" width="155" height="40" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="339" y="140" text-anchor="middle" font-size="11.5" fill="#e2e8f0">PII Detection</text>
  <rect x="427" y="115" width="155" height="40" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="504" y="140" text-anchor="middle" font-size="11.5" fill="#e2e8f0">Injection Defence</text>

  <rect x="262" y="163" width="155" height="40" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="339" y="188" text-anchor="middle" font-size="11.5" fill="#e2e8f0">Policy Engine</text>
  <rect x="427" y="163" width="155" height="40" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="504" y="188" text-anchor="middle" font-size="11.5" fill="#e2e8f0">Content Safety</text>

  <rect x="262" y="211" width="155" height="40" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="339" y="236" text-anchor="middle" font-size="11.5" fill="#e2e8f0">Audit Logger</text>
  <rect x="427" y="211" width="155" height="40" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="504" y="236" text-anchor="middle" font-size="11.5" fill="#e2e8f0">Rate / Quota</text>

  <rect x="262" y="260" width="320" height="38" rx="6" fill="#1e293b" stroke="#6D28D9" stroke-width="1.5"/>
  <text x="422" y="284" text-anchor="middle" font-size="11" fill="#c4b5fd">Hash-chained immutable audit log</text>

  <rect x="262" y="306" width="320" height="38" rx="6" fill="#1e293b" stroke="#047857" stroke-width="1.5"/>
  <text x="422" y="330" text-anchor="middle" font-size="11" fill="#6ee7b7">Mask-and-restore (PII &#x2192; token &#x2192; restore)</text>

  <!-- arrows to providers -->
  <line x1="595" y1="135" x2="650" y2="94" stroke="#64748b" stroke-width="1.5"/>
  <line x1="595" y1="183" x2="650" y2="170" stroke="#64748b" stroke-width="1.5"/>
  <line x1="595" y1="231" x2="650" y2="246" stroke="#64748b" stroke-width="1.5"/>

  <!-- Provider boxes right -->
  <rect x="650" y="72" width="230" height="44" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="1.5"/>
  <text x="765" y="99" text-anchor="middle" font-size="12" fill="#1e293b">OpenAI / GPT-4o</text>
  <rect x="650" y="148" width="230" height="44" rx="8" fill="#F5F3FF" stroke="#6D28D9" stroke-width="1.5"/>
  <text x="765" y="175" text-anchor="middle" font-size="12" fill="#1e293b">Anthropic / Claude</text>
  <rect x="650" y="224" width="230" height="44" rx="8" fill="#FFFBEB" stroke="#B45309" stroke-width="1.5"/>
  <text x="765" y="251" text-anchor="middle" font-size="12" fill="#1e293b">AWS Bedrock / Llama</text>

  <!-- block decision -->
  <rect x="620" y="310" width="270" height="36" rx="18" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.5"/>
  <text x="755" y="333" text-anchor="middle" font-size="11.5" fill="#B91C1C">Block / Mask / Switch to private model</text>

  <!-- Tool labels bottom -->
  <text x="450" y="425" text-anchor="middle" font-size="11.5" fill="#64748b">Implementations: NeMo Guardrails &#x00B7; OpenGuardrails &#x00B7; PolicyAware &#x00B7; ToTra</text>
  <text x="450" y="445" text-anchor="middle" font-size="11.5" fill="#64748b">All provide an OpenAI-compatible drop-in proxy &#x2014; zero code changes</text>
</svg>
