  <rect x="770" y="345" width="160" height="60" rx="8" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="850" y="372" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">NextAuth.js</text>
  <text x="850" y="390" text-anchor="middle" font-size="10" fill="#64748b">Authentication</text>

  <!-- Local dev note -->
  <rect x="30" y="445" width="1040" height="28" rx="6" fill="#0f172a"/>
  <text x="550" y="464" text-anchor="middle" font-size="11" fill="#94a3b8">Local dev: pnpm dev (frontend :3000) + uvicorn main:app (backend :8000) � Deploy: vercel deploy (auto from git push)</text>
