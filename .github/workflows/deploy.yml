name: Test and deploy

# Replaces the manual `az acr build` + `az containerapp update` pair that every
# deploy to rg-governai-demo has used so far. Authentication is OIDC: GitHub mints
# a short-lived token per run and Azure trades it for access, so no credential is
# stored in this repository. See .github/AZURE_SETUP.md for the one-time wiring.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Two deploys racing would leave the container app on whichever revision happened
# to finish last, which is not necessarily the newer commit. Queue instead of
# cancelling: a cancelled deploy can strand a half-applied revision.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required for OIDC; without it azure/login cannot get a token

env:
  REGISTRY: acrgovernaidemo
  IMAGE: governai
  RESOURCE_GROUP: rg-governai-demo
  CONTAINER_APP: governai

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # `npm test` runs the production build first, so a build break fails here
      # rather than surfacing as a broken image later.
      - run: npm test

  deploy:
    name: Deploy to Container Apps
    needs: test
    # Pull requests get the test job only. Nothing from a fork should be able to
    # reach the registry or the running app.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Tagged with the commit SHA so a running revision can be traced back to
      # source. `latest` moves too, for anyone pulling by convenience tag.
      - name: Build image in ACR
        run: |
          az acr build \
            --registry "$REGISTRY" \
            --image "$IMAGE:${{ github.sha }}" \
            --image "$IMAGE:latest" \
            --file Dockerfile .

      - name: Update container app
        run: |
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$REGISTRY.azurecr.io/$IMAGE:${{ github.sha }}" \
            --output none

      - name: Wait for the new revision to serve traffic
        run: |
          FQDN=$(az containerapp show \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "Probing https://$FQDN"

          # A deploy that reports success while the app serves 404 is the failure
          # mode worth catching: it is what a stopped container app looks like.
          for attempt in $(seq 1 30); do
            code=$(curl -s -m 30 -o /tmp/catalog.json -w "%{http_code}" \
              "https://$FQDN/api/catalog" || echo 000)
            if [ "$code" = "200" ]; then
              node -e '
                const c = require("/tmp/catalog.json");
                if (!c.industries?.length || !c.standards?.length) {
                  throw new Error("catalog served but empty");
                }
                console.log(`live: ${c.industries.length} industries, ${c.standards.length} standards`);
              '
              exit 0
            fi
            echo "attempt $attempt: HTTP $code"
            sleep 10
          done

          echo "::error::$CONTAINER_APP never returned 200. If runningStatus is Stopped, the image deployed but nothing is serving it."
          az containerapp show --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" \
            --query "{runningStatus:properties.runningStatus,revision:properties.latestRevisionName}" -o json
          exit 1
