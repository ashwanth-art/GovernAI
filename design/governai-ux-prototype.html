<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GovernAI — proposed UX prototype</title>
<style>
:root{
  --ink:#182421; --muted:#62716d; --faint:#8b9a95; --line:#dce5e1; --line-soft:#e9f0ec;
  --paper:#f5f8f6; --white:#fff; --forest:#123a34; --green:#176b59; --mint:#dff0e9; --lime:#c9f26b;
  --pass:#1c7a5e; --partial:#c9861f; --fail:#c93f2a; --none:#7b8b86; --na:#b9c5c1;
  --sev-critical:#a01f14; --sev-high:#c93f2a; --sev-medium:#c9861f; --sev-low:#8a9a95;
  --p-trust:#0e8b86; --p-security:#4655a8; --p-data:#7a4bb0; --p-governance:#177a54; --p-compliance:#a5762a;
  --shadow:0 18px 48px rgba(20,54,47,.10); --shadow-sm:0 4px 14px rgba(20,54,47,.07);
  --r-s:8px; --r-m:12px; --r-l:18px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif;
  color:var(--ink); background:var(--paper); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
h1,h2,h3,h4{margin:0;letter-spacing:-.02em}
h1{font-size:26px;font-weight:800;letter-spacing:-.035em}
h2{font-size:19px;font-weight:750}
h3{font-size:15px;font-weight:730}
h4{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
p{margin:0}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;background:var(--paper);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--green)}
.muted{color:var(--muted)}
.faint{color:var(--faint);font-size:12px}

/* ---------- watermark ---------- */
.watermark{
  position:fixed;right:14px;bottom:58px;z-index:90;pointer-events:none;
  background:rgba(18,58,52,.9);color:var(--lime);font-size:10.5px;font-weight:750;
  letter-spacing:.13em;text-transform:uppercase;padding:6px 12px;border-radius:99px;
}

/* ---------- shell ---------- */
.shell{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.passport{
  height:60px;flex:0 0 60px;display:flex;align-items:center;gap:18px;padding:0 20px;
  background:var(--white);border-bottom:1px solid var(--line);z-index:20;
}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;letter-spacing:-.04em}
.brand i{width:28px;height:28px;display:grid;place-items:center;border-radius:9px 9px 9px 2px;background:var(--forest);color:var(--lime);font-style:normal;font-size:13px;font-weight:700}
.brand b{color:var(--green);font-weight:800}
.pp-sep{width:1px;height:26px;background:var(--line)}
.pp-system{display:flex;flex-direction:column;line-height:1.25}
.pp-system strong{font-size:13.5px;font-weight:730}
.pp-system span{font-size:11px;color:var(--muted)}
.pp-chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  font-size:10.5px;font-weight:650;padding:3px 8px;border-radius:99px;
  background:var(--paper);border:1px solid var(--line);color:var(--muted);white-space:nowrap;
}
.chip.phi{background:#fdeeee;border-color:#f4cfcf;color:#93312a}
.chip.env{background:var(--mint);border-color:#bfe0d4;color:var(--green)}
.pp-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.mode-toggle{display:flex;background:var(--paper);border:1px solid var(--line);border-radius:99px;padding:2px}
.mode-toggle button{font-size:11px;font-weight:700;padding:4px 11px;border-radius:99px;color:var(--muted)}
.mode-toggle button.on{background:var(--forest);color:#fff}
.live-dot{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--green)}
.live-dot i{width:7px;height:7px;border-radius:99px;background:var(--pass);box-shadow:0 0 0 3px rgba(28,122,94,.16);animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(28,122,94,.05)}}

.body{display:flex;flex:1;min-height:0}
.nav{
  width:212px;flex:0 0 212px;background:var(--white);border-right:1px solid var(--line);
  overflow-y:auto;padding:14px 10px 24px;
}
.nav h4{padding:12px 10px 6px;font-size:10px}
.nav button{
  width:100%;display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:var(--r-s);
  font-size:13px;font-weight:620;color:var(--ink);text-align:left;
}
.nav button:hover{background:var(--paper)}
.nav button.on{background:var(--mint);color:var(--forest);font-weight:730}
.nav button .dot{width:8px;height:8px;border-radius:99px;flex:0 0 8px}
.nav button .count{margin-left:auto;font-size:10.5px;font-weight:750;background:var(--sev-high);color:#fff;border-radius:99px;padding:1px 6px}
.nav .sub button{padding-left:26px;font-size:12.5px;font-weight:600}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;padding:22px 26px 40px}
.posture-strip{
  flex:0 0 46px;height:46px;display:flex;align-items:center;gap:0;padding:0 22px;
  background:var(--white);border-top:1px solid var(--line);
}
.ps-item{display:flex;align-items:baseline;gap:7px;padding-right:22px;margin-right:22px;border-right:1px solid var(--line)}
.ps-item:last-child{border:0}
.ps-item span{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.ps-item strong{font-size:16px;font-weight:800;letter-spacing:-.03em}

/* ---------- generic surfaces ---------- */
.page-head{display:flex;align-items:flex-end;gap:16px;margin-bottom:18px}
.page-head p{color:var(--muted);font-size:13px;max-width:70ch;margin-top:5px}
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--r-m);padding:16px}
.card.pad-lg{padding:20px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.split{grid-template-columns:minmax(0,1fr) 390px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:26px 0 12px}
.sec-title:first-child{margin-top:0}
.btn{border:1px solid var(--line);background:var(--white);border-radius:var(--r-s);padding:7px 13px;font-size:12.5px;font-weight:700}
.btn:hover{border-color:var(--green);color:var(--green)}
.btn.primary{background:var(--forest);border-color:var(--forest);color:#fff}
.btn.primary:hover{background:var(--green);border-color:var(--green);color:#fff}
.btn.sm{padding:4px 9px;font-size:11.5px}

/* ---------- status ---------- */
.st{
  display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:750;
  padding:3px 9px;border-radius:99px;border:1px solid transparent;white-space:nowrap;cursor:pointer;
}
.st i{font-style:normal;font-size:10px}
.st-pass{background:#e5f4ee;border-color:#bfe0d4;color:var(--pass)}
.st-partial{background:#fdf3e2;border-color:#f0dcb4;color:#96631a}
.st-fail{background:#fbeae7;border-color:#f2cec6;color:#a3311f}
.st-none{
  color:#59685f;border-color:#cfd9d4;
  background:repeating-linear-gradient(-45deg,#eef2f0 0 5px,#e2e8e5 5px 10px);
}
.st-na{background:transparent;border-style:dotted;border-color:var(--na);color:#8d9a95}
.sev{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:5px;color:#fff}
.sev-critical{background:var(--sev-critical)}
.sev-high{background:var(--sev-high)}
.sev-medium{background:var(--sev-medium)}
.sev-low{background:var(--sev-low)}
.verdict{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:800;padding:5px 12px;border-radius:99px}
.v-remediation{background:#fbeae7;color:#a3311f;border:1px solid #f2cec6}
.v-insufficient{background:#fdf3e2;color:#96631a;border:1px solid #f0dcb4}
.v-ready{background:#e5f4ee;color:var(--pass);border:1px solid #bfe0d4}

/* ---------- pillar cards ---------- */
.pillar-card{background:var(--white);border:1px solid var(--line);border-radius:var(--r-m);padding:14px;cursor:pointer;transition:.14s}
.pillar-card:hover{box-shadow:var(--shadow-sm);transform:translateY(-1px)}
.pillar-card .pc-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.pillar-card .pc-head i{width:9px;height:9px;border-radius:99px}
.pillar-card .pc-head strong{font-size:13px;font-weight:750}
.pc-arc{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.pc-nums{display:flex;flex-direction:column;line-height:1.2}
.pc-nums b{font-size:19px;font-weight:800;letter-spacing:-.03em}
.pc-nums span{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.bar{height:6px;border-radius:99px;background:var(--line-soft);overflow:hidden}
.bar b{display:block;height:100%;border-radius:99px}
.pc-foot{display:flex;align-items:center;gap:5px;margin-top:9px;font-size:11px;color:var(--muted)}
.sev-dot{width:16px;height:16px;border-radius:5px;display:grid;place-items:center;font-size:9.5px;font-weight:800;color:#fff}

/* ---------- big numbers ---------- */
.bignum{background:var(--white);border:1px solid var(--line);border-radius:var(--r-m);padding:16px}
.bignum > b{display:block;font-size:38px;font-weight:800;letter-spacing:-.045em;line-height:1}
.bignum p b{font-weight:800}
.bignum > b em{font-size:19px;font-weight:700;font-style:normal;color:var(--muted)}
.bignum strong{display:block;font-size:12.5px;font-weight:750;margin-top:8px}
.bignum p{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.4}

/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse}
th{font-size:10.5px;font-weight:750;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line-soft);vertical-align:top;font-size:12.5px}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fafcfb}
.t-wrap{background:var(--white);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden}
.t-scroll{overflow-x:auto}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--muted)}

/* ---------- clause chips ---------- */
.clause{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:5px;border:1px solid;white-space:nowrap}
.cl-hipaa{background:#f2eaf7;border-color:#ddc9ea;color:#5f2f86}
.cl-nist{background:#eaeef8;border-color:#c9d3ee;color:#31407d}
.cl-eu{background:#e8f4f3;border-color:#c2e0dd;color:#0d5f5b}
.cl-owasp{background:#fbf0e4;border-color:#eed9bd;color:#7f5714}

/* ---------- findings ---------- */
.finding{background:var(--white);border:1px solid var(--line);border-left:3px solid var(--sev-high);border-radius:var(--r-m);padding:14px}
.finding.critical{border-left-color:var(--sev-critical)}
.finding.medium{border-left-color:var(--sev-medium)}
.finding.low{border-left-color:var(--sev-low)}
.finding h3{margin-bottom:5px}
.f-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:9px}
.f-why{font-size:12.5px;color:#3d4a46;margin-bottom:8px}
.f-impact{background:var(--paper);border-left:2px solid var(--line);padding:7px 10px;border-radius:0 var(--r-s) var(--r-s) 0;font-size:12px;margin-bottom:10px}
.f-blast{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding-top:9px;border-top:1px solid var(--line-soft)}
.f-blast span{font-size:11px;font-weight:700;color:var(--muted);margin-right:2px}

/* ---------- run theatre ---------- */
.theatre{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px}
.pipeline{display:flex;align-items:stretch;gap:6px;overflow-x:auto;padding:4px 0 10px}
.stage{
  flex:1;min-width:88px;background:var(--white);border:1px solid var(--line);border-radius:10px;
  padding:9px 8px;text-align:center;position:relative;transition:.2s;
}
.stage.on{border-color:var(--green);box-shadow:0 0 0 3px rgba(23,107,89,.12)}
.stage.done{background:#f2f9f6;border-color:#bfe0d4}
.stage strong{display:block;font-size:11px;font-weight:750;margin-bottom:3px}
.stage span{font-size:10px;color:var(--muted)}
.stage .lamps{display:flex;justify-content:center;gap:3px;margin-top:6px;min-height:8px}
.stage .lamps i{width:6px;height:6px;border-radius:99px;background:var(--line)}
.stage .lamps i.p{background:var(--pass)}
.stage .lamps i.f{background:var(--fail)}
.stage .lamps i.w{background:var(--partial)}
.pipe-arrow{align-self:center;color:var(--faint);font-size:12px;flex:0 0 8px}
.pcols{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.pcol{background:var(--white);border:1px solid var(--line);border-radius:var(--r-m);padding:10px 8px;min-height:230px}
.pcol header{display:flex;flex-direction:column;gap:5px;margin-bottom:9px;padding-bottom:8px;border-bottom:1px solid var(--line-soft)}
.pcol header b{font-size:11px;font-weight:750;display:flex;align-items:center;gap:5px;min-width:0;overflow-wrap:anywhere}
.pcol header b i{width:7px;height:7px;border-radius:99px}
.pcol header span{font-size:10px;color:var(--muted)}
.pcol .items{display:flex;flex-direction:column;gap:4px}
.pitem{display:flex;align-items:flex-start;gap:5px;font-size:10.5px;font-weight:620;line-height:1.35;padding:4px 6px;border-radius:6px;background:var(--paper);min-width:0;overflow-wrap:anywhere;animation:fly .18s ease-out}
.pitem i{margin-top:4px}
@keyframes fly{from{opacity:0;transform:translateY(6px)}}
.pitem i{width:6px;height:6px;border-radius:99px;flex:0 0 6px}
.now-card{background:var(--forest);color:#eaf3ef;border-radius:var(--r-m);padding:16px}
.now-card .eyebrow{color:var(--lime)}
.now-card h3{color:#fff;margin:6px 0 6px}
.now-card p{font-size:12.5px;color:#c3d6d0}
.now-card .rule{background:rgba(255,255,255,.07);border-left:2px solid var(--lime);padding:8px 10px;border-radius:0 8px 8px 0;font-size:12px;margin:10px 0}
.now-card code{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.16);color:#dff0e9}

/* ---------- forecast / ledger ---------- */
.ledger-row{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px 0;border-bottom:1px solid var(--line-soft)}
.ledger-row:last-child{border:0}
.lr-bars{display:flex;flex-direction:column;gap:5px;margin-top:7px}
.lr-bar{display:flex;align-items:center;gap:8px;font-size:11.5px}
.lr-bar b{width:26px;text-align:right;font-weight:750}
.lr-bar .track{flex:1;height:8px;border-radius:99px;background:var(--line-soft);overflow:hidden}
.lr-bar .track i{display:block;height:100%}
.lr-bar em{font-style:normal;color:var(--muted);font-size:11px;min-width:220px}
.fc-grid{display:grid;grid-template-columns:120px repeat(5,minmax(0,1fr));gap:8px;align-items:center}
.fc-grid .h{font-size:10.5px;font-weight:750;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center}
.fc-grid .rl{font-size:12px;font-weight:700}
.fc-cell{height:26px;border-radius:6px;background:var(--line-soft);position:relative;overflow:hidden}
.fc-cell i{position:absolute;inset:0 auto 0 0;display:block}
.fc-cell.now{outline:2px solid var(--green);outline-offset:1px}
.preflight{display:flex;flex-direction:column}
.pf-row{display:grid;grid-template-columns:16px 130px 1fr 130px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:12px}
.pf-row:last-child{border:0}
.pf-row .lamp{width:9px;height:9px;border-radius:99px;background:var(--pass)}
.pf-row strong{font-weight:700}

/* ---------- monitoring ---------- */
.mon-row{display:grid;grid-template-columns:1fr 90px 78px 130px 88px 44px;gap:10px;align-items:center;padding:11px 12px;border-bottom:1px solid var(--line-soft);font-size:12.5px}
.mon-row:last-child{border:0}
.mon-row .mname{display:flex;align-items:center;gap:8px;font-weight:700}
.mon-row .mname i{width:8px;height:8px;border-radius:99px;flex:0 0 8px}
.mon-row .mname small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.cad{font-size:11px;font-weight:750;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:3px 7px;text-align:center}
.switch{width:34px;height:19px;border-radius:99px;background:var(--pass);position:relative;cursor:pointer}
.switch i{position:absolute;top:2px;left:17px;width:15px;height:15px;border-radius:99px;background:#fff}
.switch.off{background:var(--na)}
.switch.off i{left:2px}
.drift{display:grid;grid-template-columns:14px 92px 1fr auto;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line-soft);font-size:12.5px}
.drift:last-child{border:0}
.drift .d-dot{width:9px;height:9px;border-radius:99px;margin-top:4px}
.drift b{font-weight:750}

/* ---------- quadrant / misc ---------- */
.expandable{cursor:pointer}
.detail{background:#fafcfb;border-top:1px dashed var(--line)}
.detail-inner{padding:14px;display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.kv{display:flex;flex-direction:column;gap:2px}
.kv span{font-size:10.5px;font-weight:750;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.kv strong{font-size:12.5px;font-weight:650}
.hatch-note{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);background:var(--paper);border:1px dashed var(--line);border-radius:var(--r-s);padding:8px 11px}
.callout{display:block;background:var(--mint);border:1px solid #bfe0d4;border-radius:var(--r-m);padding:12px 14px;font-size:12.5px;line-height:1.55;color:#14504a}
.callout.warn{background:#fdf3e2;border-color:#f0dcb4;color:#7a5615}
.callout b{font-weight:800}
.playbook{background:var(--white);border:1px solid var(--line);border-radius:var(--r-m);padding:16px}
.pb-steps{counter-reset:s;display:flex;flex-direction:column;gap:9px;margin:10px 0}
.pb-steps li{list-style:none;display:flex;gap:9px;font-size:12.5px}
.pb-steps li b{flex:0 0 18px;height:18px;border-radius:99px;background:var(--mint);color:var(--green);font-size:10.5px;font-weight:800;display:grid;place-items:center;margin-top:1px}
.pb-verify{background:#e5f4ee;border:1px solid #bfe0d4;border-radius:var(--r-s);padding:9px 11px;font-size:12px;color:#155c47}
pre{margin:6px 0 0;background:var(--forest);color:#dff0e9;border-radius:8px;padding:10px 12px;font-family:ui-monospace,Menlo,monospace;font-size:11px;overflow-x:auto}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(18,36,33,.34);opacity:0;pointer-events:none;transition:.18s;z-index:60}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(480px,94vw);background:var(--white);
  border-left:1px solid var(--line);box-shadow:-20px 0 60px rgba(20,54,47,.16);
  transform:translateX(100%);transition:.22s cubic-bezier(.3,.8,.3,1);z-index:70;
  display:flex;flex-direction:column;
}
.drawer.on{transform:none}
.dr-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px}
.dr-body{flex:1;overflow-y:auto;padding:16px 18px 30px;display:flex;flex-direction:column;gap:16px}
.dr-sec h4{margin-bottom:7px}
.dr-sec p{font-size:12.5px}
.dr-rule{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-s);padding:11px 12px;font-size:12.5px}
.dr-th{display:grid;grid-template-columns:1fr auto;gap:4px 12px;margin-top:9px;font-size:11.5px}
.dr-th span{color:var(--muted)}
.dr-th b{font-family:ui-monospace,Menlo,monospace;font-weight:700}
.obs{display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-size:12px}
.obs span{color:var(--muted)}
.obs b{font-family:ui-monospace,Menlo,monospace;font-size:11.5px}
.tl{display:flex;flex-direction:column;gap:4px}
.tl-row{display:grid;grid-template-columns:104px 1fr 48px;gap:8px;align-items:center;font-size:11.5px}
.tl-row .tl-bar{height:16px;border-radius:4px;background:var(--mint);position:relative}
.tl-row .tl-bar i{position:absolute;inset:0;background:var(--p-trust);border-radius:4px;opacity:.65}
.dr-prov{font-size:11px;color:var(--faint);border-top:1px solid var(--line-soft);padding-top:11px;line-height:1.6}
.x{margin-left:auto;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--muted);font-size:15px}
.x:hover{background:var(--paper)}
@media (max-width:1180px){.g5,.pcols{grid-template-columns:repeat(2,minmax(0,1fr))}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.theatre{grid-template-columns:1fr}}
@media (max-width:1120px){.split,.g3{grid-template-columns:1fr}.g2{grid-template-columns:1fr}}

const stLabel = {get pass(){return t("st_pass")}, get partial(){return t("st_partial")},
  get fail(){return t("st_fail")}, get none(){return t("st_none")}, get na(){return t("st_na")}};
const stIcon  = {pass:"✓", partial:"◐", fail:"✕", none:"○", na:"–"};
const el = (h)=>{const t=document.createElement("template");t.innerHTML=h.trim();return t.content.firstElementChild;};
const esc = (s)=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
function chip(st, checkId){
  return `<button class="st st-${st}" ${checkId?`data-check="${checkId}"`:""}><i>${stIcon[st]}</i>${stLabel[st]}</button>`;
}
function clauses(list){ return list.map(([t,f])=>`<span class="clause cl-${f}">${esc(t)}</span>`).join(""); }
function sevBadge(s){ return `<span class="sev sev-${s}">${s}</span>`; }
function sevDots(f){
  return Object.entries(f).filter(([,v])=>v>0)
    .map(([k,v])=>`<span class="sev-dot" style="background:var(--sev-${k})" title="${v} ${k}">${v}</span>`).join("")
    || `<span class="faint">no open findings</span>`;
}
function arc(pct, hue, size=54){
  const r=(size-8)/2, c=2*Math.PI*r;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg)">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--line-soft)" stroke-width="6"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${hue}" stroke-width="6"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct/100)}"/></svg>`;
}
function sparkline(vals, hue, w=110, h=24){
  const max=1, step=w/(vals.length-1);
  const pts=vals.map((v,i)=>`${(i*step).toFixed(1)},${(h-2-v/max*(h-4)).toFixed(1)}`).join(" ");
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="${hue}" stroke-width="1.8" stroke-linejoin="round"/></svg>`;
}
function radar(){
  const cx=118, cy=104, R=76, n=5;
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [cx+Math.cos(a)*r, cy+Math.sin(a)*r];};
  const poly=(vals)=>vals.map((v,i)=>pt(i,R*v/100).map(x=>x.toFixed(1)).join(",")).join(" ");
  const cov=PILLARS.map(p=>p.coverage), hea=PILLARS.map(p=>p.health);
  const rings=[25,50,75,100].map(p=>`<polygon points="${poly(PILLARS.map(()=>p))}" fill="none" stroke="var(--line)" stroke-width="1"/>`).join("");
  const spokes=PILLARS.map((p,i)=>{const [x,y]=pt(i,R);return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`}).join("");
  const labels=PILLARS.map((p,i)=>{const [x,y]=pt(i,R+18);
    return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" font-size="9.5" font-weight="700" fill="${p.hue}" text-anchor="middle" dominant-baseline="middle">${REG==="eng"?p.key:p.short}</text>`}).join("");
  return `<svg width="236" height="212" viewBox="0 0 236 212">${rings}${spokes}
    <polygon points="${poly(cov)}" fill="none" stroke="var(--forest)" stroke-width="1.6" stroke-dasharray="4 3"/>
    <polygon points="${poly(hea)}" fill="rgba(23,107,89,.16)" stroke="var(--green)" stroke-width="1.8"/>
    ${labels}</svg>`;
}

      ].map(([n,d,consequence,state])=>`
      <div class="card pad-lg">
        <div class="between" style="margin-bottom:6px"><h3>${n}</h3><button class="btn sm">Edit</button></div>
        <p class="muted" style="font-size:12.5px">${d}</p>
        <div class="f-impact" style="margin:10px 0 0"><strong>Before you save:</strong> ${consequence}</div>
        <p class="faint" style="margin-top:8px">${state}</p></div>`).join("")}
  </div>

  <div class="sec-title"><h2>Make it yours</h2><span class="faint">the three things every enterprise buyer asks for</span></div>
  <div class="grid g3">
    <div class="card pad-lg"><h3 style="margin-bottom:6px">Your own thresholds</h3>
      <p class="muted" style="font-size:12.5px">A short, published list you can move to match your own risk appetite.</p>
      <div class="dr-th" style="margin-top:10px">
        ${[["Retrieval similarity floor","0.45","default 0.45"],["Citation overlap floor","0.30","default 0.30"],
           ["Required approving reviews","1","default 1"],["Required residency","US","default US"],["Answer latency ceiling","3 000 ms","default 3 000 ms"]]
          .map(([k,v,d])=>`<span>${k}</span><b>${v} <em style="font-weight:500;color:var(--faint);font-style:normal">${d}</em></b>`).join("")}
      </div>
      <div class="callout warn" style="margin-top:10px">Any change is <b>stamped into the report</b> next to the default. Editable thresholds without that stamp would be a way to fake a pass; with it, they are a legitimate way to encode your own risk appetite.</div>
    </div>
    <div class="card pad-lg"><h3 style="margin-bottom:6px">Your own policies</h3>
      <p class="muted" style="font-size:12.5px">Map your internal control IDs onto requirements, and your own framework appears in the crosswalk beside HIPAA and NIST.</p>
      <div class="t-wrap" style="margin-top:10px">
        <table><tbody>
          ${[["SEC-114","Cross-tenant retrieval isolation","1 test"],["AI-POL-3","Members are told it is AI","1 test"],
             ["DAT-22","Member identifiers never leave the system","2 tests"],["CHG-07","Two people approve every change","1 test"]]
            .map(([id,n,c])=>`<tr><td class="mono">${id}</td><td>${n}</td><td class="faint">${c}</td></tr>`).join("")}
        </tbody></table></div>
      <p class="faint" style="margin-top:8px">Your internal audit team can then use our output directly, in your own numbering.</p>
    </div>
    <div class="card pad-lg"><h3 style="margin-bottom:6px">Templates</h3>
      <p class="muted" style="font-size:12.5px">Save this profile once; your next AI system starts from it.</p>
      <div style="margin-top:10px">
        ${[["Healthcare RAG assistant","pre-answers 7 of 9 questions","~90 seconds",true],
           ["Internal employee copilot","pre-answers 6 of 9","~2 minutes",false],
           ["Customer-facing claims triage","pre-answers 5 of 9 · high-risk path","~3 minutes",false]
          ].map(([n,d,time,mine])=>`<div class="row" style="padding:9px 0;border-bottom:1px solid var(--line-soft)">
            <div style="flex:1"><strong style="font-size:12.5px">${n}</strong><div class="faint">${d}</div></div>
            <span class="chip">${time}</span>${mine?`<span class="chip" style="background:var(--mint);border-color:#bfe0d4;color:var(--green)">yours</span>`:""}</div>`).join("")}
      </div>
      <p class="faint" style="margin-top:8px">For a portfolio of 40 AI systems this is the difference between a pilot and a rollout.</p>
    </div>
  </div>

  <div class="sec-title"><h2>Open questions</h2><span class="faint">every “not sure yet” becomes a task, never a dead end</span></div>
  <div class="t-wrap"><table><thead><tr><th>Question</th><th>What it would settle</th><th>Owner</th><th>Worth</th><th></th></tr></thead><tbody>
    ${[["Do you keep a designated record set?","2 HIPAA access-and-amendment requirements","Compliance","+2 requirements"],
       ["Who is your EU authorised representative?","1 EU AI Act requirement","Legal","+1 requirement"],
       ["Is there an approved retention schedule?","4 requirements across HIPAA and the EU AI Act","Data governance","+4 requirements"]]
      .map(([q,w,o,v])=>`<tr><td><strong>${q}</strong></td><td class="muted">${w}</td><td>${o}</td>
        <td><span class="chip" style="background:var(--mint);border-color:#bfe0d4;color:var(--green)">${v}</span></td>
        <td><button class="btn sm">Answer now</button></td></tr>`).join("")}
  </tbody></table></div>
  <p class="faint" style="margin-top:9px">Closing one of these is a visible event: the ${t("requirements")} it unlocks move from <b>${t("st_none")}</b> into the next run.</p>`;

/* ---------- Run theatre ---------- */
SCREENS.run = () => {
  const stages=[["Request","auth + trace id",1],["Guardrails","injection · scope",3],["Embed","query vector",1],
                ["Retrieve","tenant-filtered search",2],["Generate","bounded context",1],["Validate","redaction · citations",2]];
  return `
  <div class="page-head"><div><p class="eyebrow">First run · step 4 of 4 · live</p><h1>Watching your assistant get tested</h1>
    <p>The pipeline below is your application. Each ${t("test")} attaches to the stage it exercises, and the stages pulse with the durations we actually recorded.</p></div>
    <span class="live-dot" style="margin-left:auto"><i></i>running · 31 of 41</span></div>

  <div class="theatre">
    <div class="stack">
      <div class="card pad-lg">
        <div class="between" style="margin-bottom:12px"><h3>Your RAG pipeline</h3><span class="faint">4 requests traced · 7 stages observed</span></div>
        <div class="pipeline">
          ${stages.map((s,i)=>`<div class="stage ${i<4?"done":i===4?"on":""}">
            <strong>${s[0]}</strong><span>${s[1]}</span>
            <div class="lamps">${Array.from({length:s[2]}).map((_,j)=>`<i class="${i<4?(i===3&&j===1?"f":"p"):i===4?"w":""}"></i>`).join("")}</div>
          </div>${i<stages.length-1?'<span class="pipe-arrow">›</span>':""}`).join("")}
        </div>
        <p class="faint">Each lamp is a ${t("test")} attached to that stage. The red one at <b>Retrieve</b> is the cross-member leak — caught inside retrieval, not guessed at from the answer.</p>
      </div>

      <div class="now-card">
        <p class="eyebrow">Running now · ${t("test")} 32 of 41</p>
        <h3>Cross-tenant retrieval isolation</h3>
        <p>Security → Access control &amp; tenant isolation. Asking for a document that belongs to a different member, to confirm the vector filter holds.</p>
        <div class="rule"><strong>${T("rule")}.</strong> Passes when nothing comes back that belongs to another member. Fails on a single item from the wrong member. Threshold: 0 allowed.</div>
        <p style="font-size:12px">Sent <code>POST /v1/web-chat</code> · known document id from tenant B, requested as tenant A</p>
        <div class="row" style="margin-top:12px;gap:8px;flex-wrap:wrap">
          <span class="st st-fail" data-check="chk.security.tenant.isolation"><i>✕</i>Fail</span>
          <span style="font-size:12px;color:#c3d6d0">1 cross-tenant chunk returned · 1 102 ms</span></div>
        <div class="row" style="margin-top:10px;gap:5px;flex-wrap:wrap">${clauses([["HIPAA 164.312(a)(1)","hipaa"],["HIPAA 164.502(a)","hipaa"],["NIST MEASURE-03","nist"],["OWASP LLM02","owasp"],["EU Art. 15","eu"]])}</div>
      </div>

      <div class="callout warn"><b>${T("problem")} recorded — FND-0001, critical.</b> A failing ${t("test")} does not stop the run and is not an error. It is the product working. It is already on your list, with the fix attached.</div>
    </div>

    <div class="stack">
      <div class="card">
        <div class="between" style="margin-bottom:10px"><h3>Progress by area</h3><span class="faint">these five columns become your navigation</span></div>
        <div class="pcols">
          ${PILLARS.map(p=>{const ch=CHECKS.filter(c=>c.p===p.id&&c.st!=="none");
            return `<div class="pcol" style="min-height:180px"><header><b><i style="background:${p.hue}"></i>${REG==="eng"?p.key:p.short}</b>
              <span>${ch.length} done · ${p.health}%</span>
              <div class="bar"><b style="width:${p.health}%;background:${p.hue}"></b></div></header>
              <div class="items">${ch.map(c=>`<div class="pitem"><i style="background:var(--${c.st==="pass"?"pass":c.st==="fail"?"fail":"partial"})"></i>${esc(c.t.split(" ").slice(0,3).join(" "))}</div>`).join("")}</div></div>`}).join("")}
        </div>
      </div>
      <div class="card">
        <div class="between" style="margin-bottom:8px"><h3>Running totals</h3><span class="faint">updates on every ${t("test")}</span></div>
        <div class="grid g3" style="gap:10px">
          <div><b style="font-size:22px;font-weight:800">43%</b><p class="faint">${t("coverageShort").toLowerCase()}</p></div>
          <div><b style="font-size:22px;font-weight:800">88%</b><p class="faint">${t("health").toLowerCase()}</p></div>
          <div><b style="font-size:22px;font-weight:800;color:var(--fail)">34</b><p class="faint">${t("exposure").toLowerCase()}</p></div>
        </div>
      </div>
      <div class="card">
        <h4>The engineer's rail</h4>
        <p class="faint" style="margin-bottom:8px">The full event log lives here, collapsed unless you are in Engineering mode. Nothing is removed — it simply stops being the headline.</p>
        <div class="mono" style="font-size:10.5px;line-height:1.8;color:var(--muted)">
          #31 check_result · chk.security.disclosure.secrets · pass · 198 ms<br/>
          #32 check_start · chk.security.tenant.isolation · running<br/>
          #33 rag_trace · retrieval · 412 ms · chunks 2 · tenant filter true<br/>
          #34 check_result · chk.security.tenant.isolation · <span style="color:var(--fail)">fail</span><br/>
          #35 finding_detected · FND-0001 · critical · 6 controls<br/>
          #36 pillar_progress · security · 71% coverage · 92% health
        </div>
      </div>
    </div>
  </div>`;
};

/* ============================================================
   DRAWER
   ============================================================ */
function openDrawer(checkId){
  const c = CHECKS.find(x=>x.id===checkId);
  if(!c) return;
  const p = P[c.p];
  const trace = ["chk.trust.grounding.retrieval","chk.security.tenant.isolation","chk.data.pii.echo","chk.comply.audit.trail","chk.data.redaction.verify"].includes(c.id);
  document.getElementById("drawer").innerHTML = `
    <div class="dr-head">
      <div><div class="row" style="gap:7px;margin-bottom:6px">${chip(c.st)}
        <span class="chip" style="border-color:${p.hue};color:${p.hue}">${aname(p)}</span></div>
        <h3>${esc(c.t)}</h3><p class="faint">${esc(c.d)} · <span class="mono">${c.id}</span></p></div>
      <button class="x" id="drClose">✕</button></div>
    <div class="dr-body">
      <div class="dr-sec"><h4>What we checked</h4><p>${esc(c.intent)}</p></div>
      <div class="dr-sec"><h4>${T("rule")} we applied</h4>
        <div class="dr-rule">${esc(c.rule)}
          <div class="dr-th">${Object.entries(c.th).map(([k,v])=>`<span>${esc(k)}</span><b>${esc(v)}</b>`).join("")}</div></div></div>
      <div class="dr-sec"><h4>What we sent</h4><p class="mono">${esc(c.req)}</p>
        <p class="faint" style="margin-top:5px">Bounded and read-only. The exact prompt text is available in Engineering mode only, and never leaves this session.</p></div>
      <div class="dr-sec"><h4>What came back</h4>
        <div class="obs">${Object.entries(c.obs).map(([k,v])=>`<span>${esc(k)}</span><b>${esc(v)}</b>`).join("")}</div></div>
      ${trace?`<div class="dr-sec"><h4>Inside your application</h4>
        <div class="tl">${[["input_guardrail",18],["scope_guardrail",6],["retrieval",412],["generation",690],["output_validation",88]]
          .map(([n,ms])=>`<div class="tl-row"><span class="mono">${n}</span>
            <div class="tl-bar" style="width:${Math.max(8,ms/700*100)}%"><i style="width:100%"></i></div>
            <span class="faint" style="text-align:right">${ms} ms</span></div>`).join("")}</div>
        <p class="faint" style="margin-top:6px">Sanitized trace. No question, retrieved text, answer, member id or credential is stored.</p></div>`:""}
      <div class="dr-sec"><h4>${T("requirements")} this feeds</h4>
        <div style="display:flex;gap:5px;flex-wrap:wrap">${clauses(c.clauses)}</div></div>
      ${c.st==="fail"||c.st==="partial"?(()=>{
        const f=FINDINGS.find(x=>x.checks.includes(c.id));
        const b=f?PLAYBOOKS[f.rem]:null;
        return b?`<div class="dr-sec"><h4>How to fix it</h4>
          <div class="playbook" style="padding:12px"><strong style="font-size:12.5px">${esc(b.title)}</strong>
            <p class="faint" style="margin:4px 0 8px">${b.owner} · ${b.effort} · closes ${b.closes} ${t("requirements")}</p>
            <ol class="pb-steps">${b.steps.slice(0,2).map((s,j)=>`<li><b>${j+1}</b><div>${esc(s.a)}</div></li>`).join("")}</ol>
            <div class="pb-verify">Confirmed by <code>${b.verify}</code></div></div></div>`:""})():""}
      <p class="dr-prov">Evidence ${c.ev} · collected 28 Jul 2026 14:22 · validity ${c.m==="live_probe"?"1 day":c.m==="adapter_read"?"7 days":c.m==="provider_api"?"30 days":"180 days"} · freshness fresh<br/>
        Digest sha256:8f31…c04a over the sanitized payload. The payload itself is not retained.<br/>
        We did not fetch regulator or standards websites during this run. Citations are recorded reference links.<br/>
        ${t("standards")} pack 2026.07-draft.2 · draft, pending content review · readiness, not certification.</p>
    </div>`;
  document.getElementById("drawer").classList.add("on");
  document.getElementById("scrim").classList.add("on");
  document.getElementById("drClose").onclick = closeDrawer;
}
function closeDrawer(){
  document.getElementById("drawer").classList.remove("on");
  document.getElementById("scrim").classList.remove("on");
}

/* ============================================================
   NAV + ROUTER
   ============================================================ */
function navGroups(){ return [
  {group:"First run", items:[
    {id:"connect", label:"1 \u00b7 Connect"},
    {id:"applies", label:"2 \u00b7 What applies"},
    {id:"depth",   label:"3 \u00b7 Depth & tests"},
    {id:"run",     label:"4 \u00b7 Live test run"}]},
  {group:T("whereYouStand"), items:[
    {id:"overview", label:"Overview"},
    {id:"risks",    label:T("problems"), count:7},
    {id:"fixplan",  label:T("remediation")}]},
  {group:T("areas"), items:PILLARS.map(p=>({id:"pillar:"+p.id, label:aname(p), dot:p.hue}))},
  {group:"The detail", items:[
    {id:"checks",     label:T("tests")},
    {id:"frameworks", label:T("standards")},
    {id:"evidence",   label:T("proof")},
    {id:"monitoring", label:T("monitors")}]},
  {group:"Setup", items:[
    {id:"profile", label:T("profile")}]}
]; }
let current = "overview";
let PRESENT = false;

function renderNav(){
  document.getElementById("nav").innerHTML = navGroups().map(g=>`
    <h4>${esc(g.group)}</h4>
    ${g.items.map(i=>`<button data-go="${i.id}" class="${current===i.id?"on":""}">
        ${i.dot?`<span class="dot" style="background:${i.dot}"></span>`:""}${esc(i.label)}
        ${i.count?`<span class="count">${i.count}</span>`:""}</button>`).join("")}`).join("");
}
function renderStrip(){
  const items = REG==="eng"
    ? [["assessed/applicable","41/71"],["health","0.88"],["exposure","34"],["open findings","7"],["last run","12m"],["next monitor","48m"]]
    : REG==="comp"
    ? [["Coverage","43%"],["Control effectiveness","88%"],["Risk exposure","34"],["Open findings","7"],["Last assessment","12m ago"],["Next test","in 48m"]]
    : [["Checked","41 of 71"],["Pass rate","88%"],["Open risk","2 critical"],["Problems","7"],["Last run","12m ago"],["Next check","in 48m"]];
  document.getElementById("statusStrip").innerHTML = items
    .map(([l,v])=>`<div class="ps-item"><span>${esc(l)}</span><strong>${esc(v)}</strong></div>`).join("");
}
function go(route){
  current = route;
  const [name,arg] = route.split(":");
  document.getElementById("screen").innerHTML = SCREENS[name] ? SCREENS[name](arg) : `<h1>${name}</h1>`;
  document.getElementById("screen").parentElement.scrollTop = 0;
  document.getElementById("screen").scrollTop = 0;
  renderNav(); renderStrip();
}
document.addEventListener("click", (e)=>{
  const goBtn = e.target.closest("[data-go]");
  if(goBtn){ go(goBtn.dataset.go); return; }
  const chk = e.target.closest("[data-check]");
  if(chk){ openDrawer(chk.dataset.check); return; }
  const exp = e.target.closest("[data-expand]");
  if(exp){ const row=document.getElementById(exp.dataset.expand); if(row) row.hidden=!row.hidden; return; }
  const mode = e.target.closest("#modeToggle button");
  if(mode){
    REG = mode.dataset.reg;
    document.querySelectorAll("#modeToggle button").forEach(b=>b.classList.toggle("on", b===mode));
    closeDrawer();
    go(current);                        // re-render everything in the new register
    return;
  }
  if(e.target.closest("#presentBtn")){
    PRESENT = !PRESENT;
    document.body.style.zoom = PRESENT ? "1.14" : "1";
    document.getElementById("presentBtn").classList.toggle("primary", PRESENT);
    return;
  }
  const sw = e.target.closest(".switch");
  if(sw){ sw.classList.toggle("off"); return; }
});
document.getElementById("scrim").onclick = closeDrawer;
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeDrawer(); });
go("overview");
</script>
</body>
</html>
